name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A short Python snippet or YAML file that shows the problem.
      render: python
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Traceback or output
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      description: Output of `mchermes --version` and `python --version`, plus your OS.
    validations:
      required: true
